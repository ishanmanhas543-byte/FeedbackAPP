<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>User Feedback Form</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f4f8; }
        .box { width: 400px; margin: 60px auto; background: #fff; padding: 25px;
               border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        h2 { text-align: center; }
        label { font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
        button { padding: 9px 16px; border: none; background: #2d6cdf; color: #fff;
                 border-radius: 4px; cursor: pointer; }
        button:hover { background: #1f55b8; }
    </style>
</head>
<body>
<div class="box">
    <h2>Feedback Form</h2>
    <form action="FeedbackServlet" method="post">
        <label>Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Feedback</label>
        <textarea name="feedback" rows="5" required></textarea>

        <!-- Same form, two methods -->
        <button type="submit" formmethod="post">Submit (POST)</button>
        <button type="submit" formmethod="get">Submit (GET)</button>
    </form>
</div>
</body>
</html>
